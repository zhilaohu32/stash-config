# Stash 简化配置；订阅和 Tailscale 节点由覆写提供。
mode: rule
log-level: info
dns:
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - 223.5.5.5
proxy-providers: {}
proxies: []
proxy-groups:
  - name: Manual
    type: select
    include-all: true
    filter: "^(?!beans$).*"
  # 兼容旧覆写中指向 AI 的规则。
  - name: AI
    type: select
    proxies:
      - Manual
  - name: tailscale
    type: select
    proxies:
      - beans
rules:
  - DOMAIN-SUFFIX,ts.net,tailscale
  - IP-CIDR,100.64.0.0/10,tailscale,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,Manual
